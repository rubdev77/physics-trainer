<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152621">
<title>Ֆիզիկա · Քննության մարզիչ</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand"><span class="logo" aria-hidden="true">Ֆ</span><div><strong>Ֆիզիկա</strong><small>Քննության մարզիչ</small></div></div>
    <p class="site-note">Տվյալները այս դիտարկիչում են</p>
  </header>
  <main id="content" tabindex="-1"><p>Առաջադրանքները բեռնվում են…</p></main>
  <nav class="bottom-bar" aria-label="Ռեժիմներ">
    <span class="bottom-indicator" aria-hidden="true"></span>
    <button type="button" data-view="practice" aria-label="Ժողովածուներ" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v14H4zM14 6l4-1 3 13-4 1zM6.5 9h2"/></svg>
      <span class="bottom-label" aria-hidden="true"><span>Գրքեր</span></span>
    </button>
    <button type="button" data-view="exam" aria-label="Փորձնական քննություն">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M10 3h4m-2 10V9m0 4 2 1.5"/></svg>
      <span class="bottom-label" aria-hidden="true"><span>Քննություն</span></span>
    </button>
    <button type="button" data-view="review" aria-label="Կրկնություն">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10a7 7 0 1 1 1 7m-1-7V5m0 5h5"/></svg>
      <span class="bottom-label" aria-hidden="true"><span>Կրկնել</span></span>
    </button>
    <button type="button" data-view="stats" aria-label="Վիճակագրություն">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15v-4m6 4V5m6 10V8"/></svg>
      <span class="bottom-label" aria-hidden="true"><span>Ամփոփում</span></span>
    </button>
  </nav>
<dialog id="zoom" aria-label="Բնօրինակի խոշորացում">
  <div class="dialog-head"><strong>Բնօրինակը</strong><div class="row"><button id="zoom-page" class="plain" hidden>Ամբողջ էջը</button><button id="zoom-scale" class="plain" aria-pressed="false">Խոշորացնել</button><button id="close-zoom" class="plain" autofocus>Փակել ×</button></div></div>
  <div id="zoom-pages"></div>
</dialog>
<dialog id="stats-reset-dialog" aria-labelledby="stats-reset-title">
  <h2 id="stats-reset-title">Զրոյացնե՞լ վիճակագրությունը</h2>
  <p>Այս դիտարկիչում կջնջվի փորձերի պատմությունը։ Պահված մարզումները և նշված առաջադրանքները կմնան։</p>
  <form class="row" method="dialog">
    <button class="plain" value="cancel" autofocus>Չեղարկել</button>
    <button class="primary danger" value="reset">Զրոյացնել</button>
  </form>
</dialog>
</body>
</html>
